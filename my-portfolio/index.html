<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Viktoriia Kuznetsova">
    <meta name="robots" content="index, follow">
    
    <!-- Performance optimizations -->
    <link rel="dns-prefetch" href="https://vercel.app">
    <link rel="preconnect" href="https://vercel.app" crossorigin>
  
    <title>Viktoriia Kuznetsova | Fullstack Developer</title>
    <meta name="description" content="Fullstack developer with a background in UX/UI design. I love writing clean, easy-to-read, and maintainable code. I learn by doing, exploring new tools, and creating high-quality projects.">
    <meta name="keywords" content="Frontend, React, TypeScript, Portfolio, Web Developer, Viktoriia Kuznetsova">
  

  <!-- Critical Resources -->
  <link rel="preload" href="/fonts/Montserrat/Montserrat-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <link rel="preload" href="/fonts/Montserrat/Montserrat-Medium.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <link rel="preload" href="/fonts/Montserrat/Montserrat-SemiBold.woff2" as="font" type="font/woff2" crossorigin="anonymous">

  <!-- Fonts loading -->
  <script>
    if ('fonts' in document) {
      Promise.all([
        document.fonts.load('300 1em Montserrat'),
        document.fonts.load('400 1em Montserrat'),
        document.fonts.load('500 1em Montserrat')
      ]).then(() => {
        document.documentElement.classList.add('fonts-loaded');
      });
    }
  </script>

  <!-- Critical CSS -->
  <style>
    :root {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      font-weight: 400;
      color-scheme: light dark;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      margin: 0;
      display: flex;
      place-items: center;
      min-width: 320px;
      min-height: 100vh;
      background-color: #f5f5f5;
      color: #212121;
    }
    
    body.dark {
      background-color: #212121;
      color: #f5f5f5;
    }
    
    #root {
      width: 100%;
    }
    
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid #f5f5f5;
      border-bottom-color: #bb4273;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
    }
    
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <!-- Open Graph -->
  <meta property="og:title" content="Viktoriia Kuznetsova | Full-stack Developer">
  <meta property="og:description" content="Full-stack developer with a background in UX/UI design. I love writing clean, readable, and maintainable code.">
  <!-- <meta property="og:image" content="https://portfolio-swart-three-66.vercel.app/preview.jpg"> -->
  <meta property="og:url" content="https://viktoriiakuznetsova.vercel.app/">
  <meta property="og:type" content="website">

  <!-- Canonical -->
  <link rel="canonical" href="https://viktoriiakuznetsova.vercel.app/" />

  <!-- Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Viktoriia Kuznetsova",
    "jobTitle": "Full-stack Developer",
    "url": "https://viktoriiakuznetsova.vercel.app/",
    "sameAs": [
      "https://github.com/vkuznets23",
      "https://www.linkedin.com/in/viktoriia-kuznetsova-021300270/"
    ],
    "description": "Full-stack developer with a background in UX/UI design."
  }
  </script>

  </head>
  
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

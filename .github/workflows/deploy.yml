name: Deploy to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "20"
  WORKING_DIR: "my-portfolio"

jobs:
  # Job 1: testing and build
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "${{ env.WORKING_DIR }}/package-lock.json"

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: 🧪 Run tests
        run: npm test -- --passWithNoTests
        working-directory: ${{ env.WORKING_DIR }}

      - name: 🔍 Run linter
        run: npm run lint
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true # fail whole pipeline because of linter

      - name: 🏗️ Build project
        run: npm run build
        working-directory: ${{ env.WORKING_DIR }}

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.WORKING_DIR }}/dist
          retention-days: 7

  # Job 2: Deploy to Vercel
  deploy-vercel:
    name: Deploy to Vercel
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🚀 Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        run: cd ${{ env.WORKING_DIR }} && vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/main'
        run: cd ${{ env.WORKING_DIR }} && vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Job 3: Create release tag
  create-release:
    name: Create Release Tag
    needs: deploy-vercel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Bump version and create tag
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: main
          DRY_RUN: false

  # Job 4: Notification in Discord
  notify:
    name: Send Notification
    needs: [test-and-build, deploy-vercel, create-release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 💬 Send Discord notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "🚀 Portfolio Deployment"
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Author:** ${{ github.actor }}

            **📊 Results:**
            • Tests: ${{ needs.test-and-build.result }}
            • Deploy: ${{ needs.deploy-vercel.result }}
            • Release: ${{ needs.create-release.result }}

            **🔗 Links:**
            [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0x00ff00
          username: GitHub Actions Bot
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
